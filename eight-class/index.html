<!DOCTYPE html>
<html lang="en">
<head>
<style>
  * {
    margin: 0;
    box-sizing: border-box;
  }

  body {
    height: 500vh;
    font-family: system-ui, sans-serif;
  }

  .sticky-box {
    height: 100px;
    width: 100px;
    background-color: red; /* Default color if no bg- class is used */
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-green { background: green; z-index: 10; }
  .bg-yellow { background: yellow; }

  .spacer {
    height: 100vh;
    border-left: 5px solid #eee;
    padding: 20px;
  }

  .wrapper {
    height: 200vh;
    background: silver;
  }
</style>
</head>
<body>

  <div class="sticky-box bg-green"></div>

  <div>
    <div class="sticky-box bg-yellow"></div>
  </div>

  <div class="wrapper">
    <div class="sticky-box">x`</div>
  </div>

</body>
</html>
