<!DOCTYPE html>
<html>
<head>
    <title>Day Alert</title>
</head>
<body>

<script>
    let today = new Date();
    let dayNumber = today.getDay();
    let dayName;

    switch(dayNumber) {
        case 0:
            dayName = "Sunday";
            break;
        case 1:
            dayName = "Monday";
            break;
        case 2:
            dayName = "Tuesday";
            break;
        case 3:
            dayName = "Wednesday";
            break;
        case 4:
            dayName = "Thursday";
            break;
        case 5:
            dayName = "Friday";
            break;
        case 6:
            dayName = "Saturday";
            break;
    }

    alert("Today is " + dayName);
</script>

</body>
</html>
